name = "pagomovil-receiver"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
# Run: npx wrangler d1 create pagomovil-db
# And update database_id with your real D1 ID
[[d1_databases]]
binding = "DB"
database_name = "pagomovil-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ENVIRONMENT = "production"
