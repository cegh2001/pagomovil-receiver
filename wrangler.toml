name = "pagomovil-receiver"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
# Run: npx wrangler d1 create pagomovil-db
# And update database_id with your real D1 ID
[[d1_databases]]
binding = "DB"
database_name = "pagomovil-db"
database_id = "8a498b6a-5247-4999-b4ea-f78ec642429c"

[vars]
ENVIRONMENT = "production"
